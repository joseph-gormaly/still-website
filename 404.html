<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found | STILL</title>
    <meta name="description" content="Page not found - STILL (Sustainable Transformation Initiative for Land & Learning)">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/logo_v0.png">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            background-attachment: fixed;
        }
        .error-card {
            max-width: 32rem;
            width: 100%;
            text-align: center;
            background: var(--material-tint-strong);
            -webkit-backdrop-filter: blur(var(--material-blur)) saturate(var(--material-saturate));
            backdrop-filter: blur(var(--material-blur)) saturate(var(--material-saturate));
            padding: clamp(2rem, 6vw, 3.5rem);
            border-radius: var(--radius-2xl);
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-lg), inset 0 1px 0 var(--color-material-highlight);
        }

        .error-code {
            font-size: clamp(4rem, 16vw, 6rem);
            line-height: 1;
            color: var(--color-accent);
            margin-bottom: var(--space-sm);
        }

        .error-card p {
            max-width: none;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>
    <main class="error-card">
        <div style="margin-bottom: 2rem;">
            <img src="assets/logo_v0.png" alt="STILL Logo" style="height: 80px; margin: 0 auto;" />
        </div>
        <h1 class="error-code">404</h1>
        <h2 class="section-heading">Lost in the Meadow</h2>
        <p class="lead">
            The trail you're looking for doesn't exist or has been moved. Even bees lose their way sometimes.
        </p>
        <div class="button-row" style="justify-content: center;">
            <a href="index.html" class="btn-cta">Return to the Hive</a>
            <a href="https://www.instagram.com/_still.bz/" class="btn-outline" target="_blank" rel="noopener noreferrer">Find us on Instagram</a>
        </div>
    </main>
    <script defer src="assets/comb-light.js"></script>
</body>
</html>
